<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f7f7f8; --surface: #fff; --border: #e6e6ea; --line: #f0f0f3;
      --text: #18181b; --muted: #6b6b76; --faint: #a1a1aa;
      --accent: #2563eb; --accent-hover: #1d4ed8; --accent-ring: #c7d7fd;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      width: 340px; margin: 0; background: var(--surface); color: var(--text);
      font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; }
    .i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    header { display: flex; gap: 12px; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); }
    .fav {
      width: 38px; height: 38px; flex: none; display: grid; place-items: center;
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface);
    }
    #icon { width: 20px; height: 20px; object-fit: contain; }
    #icon.letter { width: 100%; height: 100%; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
    header > div:last-child { flex: 1; min-width: 0; }
    /* Editable title: a light box with a pencil, so it reads as a field. */
    .title-box { position: relative; display: flex; align-items: center; margin-bottom: 3px; }
    #title { height: 30px; padding: 0 28px 0 8px; font-weight: 600; font-size: 14px; border-color: var(--line); text-overflow: ellipsis; }
    .title-box .i { position: absolute; right: 9px; width: 14px; height: 14px; color: var(--faint); pointer-events: none; }
    .title-box:hover .i, #title:focus + .i { color: var(--accent); }
    #url { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    form { display: grid; gap: 12px; padding: 16px; }
    .field { display: grid; gap: 6px; }
    label { font-size: 12px; font-weight: 600; color: #3f3f46; }
    .tag { margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: var(--accent-ring); color: var(--accent); font-size: 11px; font-weight: 500; }
    .control { position: relative; display: flex; align-items: center; }
    .control .i { position: absolute; color: var(--faint); pointer-events: none; }
    .control .lead { left: 11px; }
    .control .trail { right: 11px; }
    select, input {
      width: 100%; height: 38px; padding: 0 34px; font: inherit; color: var(--text);
      border: 1px solid var(--border); border-radius: 9px; background: var(--surface); outline: none;
      appearance: none; transition: border-color .15s, box-shadow .15s;
    }
    input { padding-right: 12px; }
    select:hover, input:hover { border-color: #d4d4da; }
    select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
    input::placeholder { color: var(--faint); }
    .or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .primary {
      display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; margin-top: 2px;
      border: 0; border-radius: 9px; background: var(--accent); color: #fff; font-weight: 600;
      transition: background .15s;
    }
    .primary:hover { background: var(--accent-hover); }
    .primary span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .primary.saved { background: #16a34a; }
    .primary.exists { background: #e8f5ec; color: #15803d; cursor: default; }
    .primary.exists:hover { background: #e8f5ec; }

    .already {
      display: flex; align-items: center; gap: 8px; margin: 12px 16px 0; padding: 9px 12px;
      border: 1px solid #bbe5c8; border-radius: 9px; background: #effaf2; color: #166534; font-size: 12.5px; font-weight: 500;
    }
    .already .i { color: #16a34a; }

    #status { min-height: 18px; margin: -4px 16px 0; font-size: 12px; text-align: center; color: #b91c1c; }

    footer { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--bg); }
    footer button {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 34px;
      border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); font-weight: 500;
    }
    footer button:hover { border-color: #d4d4da; background: #fafafa; }
    footer .i { color: var(--muted); }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.17 6.81a1 1 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-all" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m2 12.65 9.17 4.16a2 2 0 0 0 1.66 0L22 12.65"/><path d="m2 17.65 9.17 4.16a2 2 0 0 0 1.66 0L22 17.65"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  </svg>

  <header>
    <div class="fav"><img id="icon" alt=""></div>
    <div>
      <div class="title-box">
        <input id="title" form="form" maxlength="300" autocomplete="off" spellcheck="false" aria-label="Title" title="Change the title before saving">
        <svg class="i"><use href="#i-pencil"/></svg>
      </div>
      <div id="url"></div>
    </div>
  </header>
  <div class="already" id="already" role="status" hidden><svg class="i"><use href="#i-check"/></svg><span id="alreadyText"></span></div>

  <form id="form">
    <div id="pick" class="field">
      <label for="folder">Save to folder <span class="tag" id="suggested" hidden>Suggested for this page</span></label>
      <div class="control">
        <svg class="i lead"><use href="#i-folder"/></svg>
        <select id="folder"></select>
        <svg class="i trail"><use href="#i-chevron"/></svg>
      </div>
      <div class="or">or</div>
    </div>
    <div class="field">
      <label for="newFolder">New folder</label>
      <div class="control">
        <svg class="i lead"><use href="#i-plus"/></svg>
        <input id="newFolder" placeholder="Folder name" autocomplete="off">
      </div>
    </div>
    <button type="submit" class="primary" id="save"><svg class="i"><use href="#i-bookmark"/></svg><span id="saveLabel">Save bookmark</span></button>
  </form>
  <div id="status" role="status"></div>

  <footer>
    <button id="open"><svg class="i"><use href="#i-all"/></svg>View all</button>
    <button id="export"><svg class="i"><use href="#i-download"/></svg>Export JSON</button>
  </footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
